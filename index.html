<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VD SPIN | Violence District Build Randomizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20261031c">
</head>
<body>

    <header>
        <h1 class="logo">VD SPIN</h1>
        <p class="subtitle">Violence District Randomizer</p>
    </header>

    <div class="top-controls">
        <div class="lang-switch">
            <button class="lang-btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false" data-i18n-title="langTitle" data-i18n-aria="langTitle" title="Язык">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19zM2.8 12h18.4M12 2.5c2.6 2.6 3.9 5.8 3.9 9.5s-1.300 6.900-3.900 9.500c-2.600-2.600-3.900-5.800-3.900-9.500S9.400 5.100 12 2.500z"/></svg>
                <span id="langLabel">RU</span>
            </button>
            <div class="lang-menu" id="langMenu" role="menu"></div>
        </div>
        <button class="sound-btn" id="soundBtn" data-i18n-title="soundTitle" title="Включить/выключить звук">🔊 ЗВУК</button>
    </div>

    <!-- СЛОТЫ БИЛДА -->
    <section class="build-section">
        <span class="build-title" data-i18n="buildTitle">ВАШ БИЛД (3 СЛОТА)</span>
        <div class="slots-container">
            <div class="slot" id="slot-0" onclick="showSlotPerk(0)">
                <div class="slot-hex">
                    <span class="slot-num">I</span>
                <img src="" alt="" onerror="this.style.opacity='0.1';">
                </div>
                <span class="slot-name"></span>
            </div>
            <div class="slot" id="slot-1" onclick="showSlotPerk(1)">
                <div class="slot-hex">
                    <span class="slot-num">II</span>
                <img src="" alt="" onerror="this.style.opacity='0.1';">
                </div>
                <span class="slot-name"></span>
            </div>
            <div class="slot" id="slot-2" onclick="showSlotPerk(2)">
                <div class="slot-hex">
                    <span class="slot-num">III</span>
                <img src="" alt="" onerror="this.style.opacity='0.1';">
                </div>
                <span class="slot-name"></span>
            </div>
        </div>
    </section>

    <!-- ЦЕНТРАЛЬНАЯ СЦЕНА: КОЛЕСО И БОЛЬШОЙ ДЖЕЙСОН -->
    <main class="stage-container">
        <div class="wheel-wrapper">
            <!-- Джейсон (зафиксирован слева, не сдвигая колесо) -->
            <div class="character-anchor">
                <div class="character-box">
                    <div class="character-nickname">sawer711</div>
                    <img src="jason.png" alt="sawer711" class="character-img" onerror="this.style.opacity='0.2';">
                </div>
            </div>

            <!-- Само колесо (строго по центру страницы) -->
            <div class="wheel-core">
                <div class="pointer"></div>
                <canvas id="wheel" width="720" height="720"></canvas>
                <div class="wheel-center-cap"></div>
                <div class="wheel-tip" id="wheelTip"></div>
            </div>
        </div>

        <div class="controls">
            <button class="action-btn" id="spinBtn">КРУТИТЬ (1/3)</button>
            <button class="action-btn card-btn" id="cardBtn" data-i18n="card" disabled>КАРТОЧКА</button>
            <button class="action-btn reset-btn" id="resetBtn" data-i18n-title="resetTitle" title="Сбросить билд">✕</button>
        </div>
        <p class="wheel-hint" data-i18n="hint">Нажми на перк на колесе, чтобы прочитать описание</p>
    </main>

    <!-- МОДАЛКА ВЫПАВШЕГО ПЕРКА -->
    <div class="modal" id="resultModal">
        <div class="modal-card">
            <div class="reward-img">
                <img id="modalImg" src="" alt="Perk Icon" onerror="this.style.opacity='0.1';">
            </div>
            <h2 class="reward-title" id="modalTitle">Perk Name</h2>
            <p class="reward-desc" id="modalDesc"></p>
            <p class="reward-quote" id="modalQuote"></p>
            <div class="modal-actions">
                <button class="close-btn" id="closeModal">ПРИНЯТЬ</button>
                <button class="close-btn reject-btn" id="rejectBtn" data-i18n="reject">НЕТ ТАКОГО ПЕРКА</button>
            </div>
        </div>
    </div>

    <!-- ФИНАЛЬНАЯ КРУТКА МАНЬЯКА (по центру экрана) -->
    <div class="modal locked" id="killerModal">
        <div class="killer-stage">
            <span class="killer-stage-title" data-i18n="killerTitle">МАНЬЯК</span>
            <div class="killer-card killer-big" id="killerCard">
                <span class="killer-placeholder">?</span>
                <img id="killerImg" src="" alt="" onerror="this.style.opacity='0.1';">
                <span class="killer-name" id="killerName"></span>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА КАРТОЧКИ БИЛДА -->
    <div class="modal" id="cardModal">
        <div class="card-modal-inner">
            <canvas id="cardCanvas" width="1200" height="600"></canvas>
            <div class="card-actions">
                <button class="action-btn" id="cardDownload" data-i18n="download">СКАЧАТЬ PNG</button>
                <button class="action-btn reset-btn" id="cardCopy" data-i18n="copy">КОПИРОВАТЬ</button>
                <button class="close-btn" id="cardClose" data-i18n="close">ЗАКРЫТЬ</button>
            </div>
            <div class="card-note" id="cardNote"></div>
        </div>
    </div>

    <!-- СОЦСЕТИ (снизу слева) -->
    <nav class="socials" data-i18n-aria="socials" aria-label="Соцсети">
        <button class="social-btn" type="button" data-soon data-label="YouTube" aria-label="YouTube">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2C.5 9.1.5 12 .5 12s0 2.9.5 4.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-4.8.5-4.8s0-2.9-.5-4.8zM9.8 15.2V8.8l5.6 3.2-5.6 3.2z"/></svg>
        </button>
        <button class="social-btn" type="button" data-soon data-label="TikTok" aria-label="TikTok">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
        </button>
        <a class="social-btn" id="robloxLink" href="https://www.roblox.com/" target="_blank" rel="noopener noreferrer" data-label="Roblox" aria-label="Roblox">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M5.2 0 .2 18.8 18.8 24l5-18.8L5.2 0zm8.2 14.9-4.3-1.1 1.1-4.3 4.3 1.1-1.1 4.3z"/></svg>
        </a>
    </nav>
    <div class="soon-toast" id="soonToast" role="status" aria-live="polite" data-i18n="soon">Скоро</div>

    <script src="perks.js?v=20261031c"></script>
    <script src="perks_i18n.js?v=20261031c"></script>
    <script src="lang.js?v=20261031c"></script>
    <script src="script.js?v=20261031c"></script>
</body>
</html>
